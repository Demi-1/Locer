<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Locer — AI</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.css">

<script defer
src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.js">
</script>

<script defer
src="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/contrib/auto-render.min.js">
</script>

<style>

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#08090d;
  color:#f5f5f7;
  height:100vh;
  overflow:hidden
}

.app{
  display:flex;
  height:100vh
}

.sidebar{
  width:270px;
  background:#0d0f14;
  border-right:1px solid #20232c;
  padding:18px;
  display:flex;
  flex-direction:column
}

.logo{
  font-size:27px;
  font-weight:800;
  margin-bottom:18px
}

.logo span{
  opacity:.45
}

.google{
  width:100%;
  padding:11px;
  border:1px solid #303440;
  border-radius:10px;
  background:#171a22;
  color:white;
  cursor:pointer;
  font-size:14px;
  margin-bottom:12px
}

.google:hover{
  background:#20242e
}

.user{
  color:#9da3b3;
  font-size:13px;
  margin-bottom:15px;
  word-break:break-word
}

.new{
  width:100%;
  padding:12px;
  border:1px solid #303440;
  border-radius:10px;
  background:#171a22;
  color:white;
  cursor:pointer;
  font-size:15px;
  margin-bottom:15px
}

.new:hover{
  background:#20242e
}

.chats{
  overflow:auto;
  flex:1
}

.chatItem{
  padding:10px;
  border-radius:9px;
  cursor:pointer;
  color:#c9ccd5;
  font-size:14px;
  margin-bottom:4px;
  display:flex;
  justify-content:space-between;
  gap:5px
}

.chatItem:hover{
  background:#181b24
}

.deleteChat{
  border:0;
  background:none;
  color:#777;
  cursor:pointer
}

.about{
  color:#777d8d;
  font-size:12px;
  line-height:1.5;
  margin-top:12px
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0
}

.top{
  height:64px;
  border-bottom:1px solid #20232c;
  display:flex;
  align-items:center;
  padding:0 24px;
  font-weight:700
}

.chat{
  flex:1;
  overflow:auto;
  padding:35px 18px 145px
}

.wrap{
  max-width:850px;
  margin:auto
}

.welcome{
  text-align:center;
  margin-top:13vh
}

.welcome h1{
  font-size:42px;
  margin:0 0 12px
}

.welcome p{
  color:#8d93a3;
  font-size:17px
}

.messages{
  display:flex;
  flex-direction:column;
  gap:22px
}

.msg{
  display:flex;
  gap:12px;
  line-height:1.65
}

.avatar{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  background:#262a35
}

.user .avatar{
  background:#4f46e5
}

.text{
  padding-top:4px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.text img{
  max-width:320px;
  max-height:320px;
  border-radius:12px;
  margin-top:8px
}

.math{
  overflow-x:auto
}

.composer{
  position:fixed;
  bottom:0;
  left:270px;
  right:0;
  padding:20px;
  background:linear-gradient(transparent,#08090d 25%)
}

.box{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  background:#151821;
  border:1px solid #343846;
  border-radius:15px;
  padding:8px
}

textarea{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  resize:none;
  padding:10px;
  font:inherit;
  min-height:43px;
  max-height:130px
}

.send,
.photo{
  width:45px;
  height:45px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-size:18px
}

.send{
  background:#f1f1f3;
  color:#111
}

.photo{
  background:#262a35;
  color:white
}

.hint{
  text-align:center;
  color:#626878;
  font-size:11px;
  margin-top:8px
}

.loading{
  opacity:.6
}

@media(max-width:700px){

  .sidebar{
    display:none
  }

  .composer{
    left:0
  }

  .top{
    padding:0 16px
  }

  .welcome h1{
    font-size:34px
  }

  .chat{
    padding-left:14px;
    padding-right:14px
  }
}

</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="logo">
    Locer<span> AI</span>
  </div>

  <button class="google" id="loginBtn">
    Войти через Google
  </button>

  <div class="user" id="userInfo">
    Войдите, чтобы сохранять чаты
  </div>

  <button class="new" onclick="newChat()">
    ＋ Новый чат
  </button>

  <div class="chats" id="chatList"></div>

  <div class="about">
    Locer — AI-помощник.<br>
    Фото заданий поддерживаются.
  </div>

</aside>

<main class="main">

  <div class="top">
    Locer
  </div>

  <section class="chat" id="chat">

    <div class="wrap">

      <div class="welcome" id="welcome">

        <h1>
          Привет, я Locer 👋
        </h1>

        <p>
          Задай вопрос или отправь фотографию задания.
        </p>

      </div>

      <div class="messages" id="messages"></div>

    </div>

  </section>

</main>

</div>

<div class="composer">

  <div class="box">

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      hidden
    >

    <button
      class="photo"
      onclick="document.getElementById('photoInput').click()"
      title="Отправить фото"
    >
      📷
    </button>

    <textarea
      id="input"
      rows="1"
      placeholder="Напиши сообщение Locer..."
    ></textarea>

    <button
      class="send"
      onclick="send()"
    >
      ➤
    </button>

  </div>

  <div class="hint">
    Locer может ошибаться. Проверяй важную информацию.
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  addDoc,
  getDocs,
  getDoc,
  setDoc,
  deleteDoc,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCRlSjT9cwWyFD_rx_vqiGahEuZkeMHsRI",

  authDomain:
    "locer-5b749.firebaseapp.com",

  projectId:
    "locer-5b749",

  storageBucket:
    "locer-5b749.firebasestorage.app",

  messagingSenderId:
    "81394379218",

  appId:
    "1:81394379218:web:545d4e8390f630a5ee400b",

  measurementId:
    "G-6GZ1HZPR65"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


const WORKER_URL =
  "https://locer-ai.ivan-ostanin1914.workers.dev";


const input =
  document.getElementById("input");

const messages =
  document.getElementById("messages");

const welcome =
  document.getElementById("welcome");

const chat =
  document.getElementById("chat");

const loginBtn =
  document.getElementById("loginBtn");

const userInfo =
  document.getElementById("userInfo");

const chatList =
  document.getElementById("chatList");

const photoInput =
  document.getElementById("photoInput");


let currentUser = null;

let currentChatId = null;

let history = [];

let selectedImage = null;


loginBtn.onclick = async () => {

  try {

    if (currentUser) {

      await signOut(auth);

    } else {

      await signInWithPopup(
        auth,
        provider
      );

    }

  } catch (error) {

    alert(
      "Ошибка входа: " +
      error.message
    );

  }
};


onAuthStateChanged(
  auth,
  async user => {

    currentUser = user;

    if (user) {

      userInfo.textContent =
        user.displayName ||
        user.email ||
        "Пользователь";

      loginBtn.textContent =
        "Выйти";

      await loadChats();

      newChat();

    } else {

      userInfo.textContent =
        "Войдите, чтобы сохранять чаты";

      loginBtn.textContent =
        "Войти через Google";

      chatList.innerHTML = "";

      newChat();
    }
  }
);


function addMessage(
  role,
  text,
  image = null
) {

  const row =
    document.createElement("div");

  row.className =
    "msg " + role;

  const avatar =
    document.createElement("div");

  avatar.className =
    "avatar";

  avatar.textContent =
    role === "user" ? "Ты" : "L";

  const content =
    document.createElement("div");

  content.className =
    "text";

  if (image) {

    const img =
      document.createElement("img");

    img.src = image;

    content.appendChild(img);

  }

  if (text) {

    const textDiv =
      document.createElement("div");

    textDiv.textContent = text;

    content.appendChild(textDiv);

  }

  row.append(
    avatar,
    content
  );

  messages.appendChild(row);

  chat.scrollTop =
    chat.scrollHeight;

  if (role === "bot") {

    renderMath(content);
  }

  return content;
}


function renderMath(element) {

  if (
    window.renderMathInElement &&
    element
  ) {

    renderMathInElement(
      element,
      {
        delimiters: [
          {
            left: "$$",
            right: "$$",
            display: true
          },
          {
            left: "\\[",
            right: "\\]",
            display: true
          },
          {
            left: "$",
            right: "$",
            display: false
          },
          {
            left: "\\(",
            right: "\\)",
            display: false
          }
        ],
        throwOnError: false
      }
    );

  }
}


async function send() {

  const text =
    input.value.trim();

  if (
    !text &&
    !selectedImage
  ) return;


  welcome.style.display =
    "none";


  const imageForDisplay =
    selectedImage;


  addMessage(
    "user",
    text,
    imageForDisplay
  );


  const userContent = [];

  if (text) {

    userContent.push({
      type: "text",
      text: text
    });

  } else {

    userContent.push({
      type: "text",
      text:
        "Реши это задание с фотографии. Объясни решение понятно и пошагово."
    });

  }


  if (selectedImage) {

    userContent.push({

      type: "image_url",

      image_url: {
        url: selectedImage
      }

    });

  }


  history.push({
    role: "user",
    content: userContent
  });


  input.value = "";

  input.style.height =
    "auto";


  const imageToClear =
    selectedImage;

  selectedImage = null;

  photoInput.value = "";


  const bot =
    addMessage(
      "bot",
      "Думаю…"
    );


  try {

    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            messages:
              history
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error?.message ||
        "Ошибка сервера"
      );

    }


    const answer =
      data.choices?.[0]?.message?.content ||
      "Не удалось получить ответ.";


    bot.textContent =
      answer;


    renderMath(bot);


    history.push({

      role: "assistant",

      content: answer

    });


    await saveChat();


    chat.scrollTop =
      chat.scrollHeight;


  } catch (error) {

    bot.textContent =
      "Ошибка подключения:\n\n" +
      error.message;

  }
}


photoInput.onchange =
  event => {

    const file =
      event.target.files[0];

    if (!file) return;


    if (
      file.size >
      15 * 1024 * 1024
    ) {

      alert(
        "Фото слишком большое. Выбери изображение до 15 МБ."
      );

      photoInput.value = "";

      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      () => {

        selectedImage =
          reader.result;

        input.placeholder =
          "Фото готово — напиши вопрос или нажми ➤";

      };


    reader.readAsDataURL(file);

  };


async function saveChat() {

  if (!currentUser) return;

  if (!history.length) return;


  const chatsRef =
    collection(
      db,
      "users",
      currentUser.uid,
      "chats"
    );


  const title =
    getTitle();


  const data = {

    title: title,

    messages:
      history.map(
        message => ({
          role:
            message.role,

          content:
            typeof message.content ===
            "string"
              ? message.content
              : message.content
                  .filter(
                    x =>
                      x.type === "text"
                  )
                  .map(
                    x => x.text
                  )
                  .join("\n")
        })
      ),

    updatedAt:
      Date.now()

  };


  if (currentChatId) {

    await setDoc(
      doc(
        db,
        "users",
        currentUser.uid,
        "chats",
        currentChatId
      ),
      data,
      {
        merge: true
      }
    );

  } else {

    const newDoc =
      await addDoc(
        chatsRef,
        data
      );

    currentChatId =
      newDoc.id;
  }


  await loadChats();

}


function getTitle() {

  for (
    const message of history
  ) {

    if (
      message.role === "user"
    ) {

      if (
        typeof message.content ===
        "string"
      ) {

        return message.content
          .slice(0, 40);

      }


      const text =
        message.content
          .find(
            x =>
              x.type === "text"
          );


      if (text) {

        return text.text
          .slice(0, 40);

      }

    }

  }

  return "Новый чат";
}


async function loadChats() {

  if (!currentUser) return;


  chatList.innerHTML = "";


  const ref =
    collection(
      db,
      "users",
      currentUser.uid,
      "chats"
    );


  const snapshot =
    await getDocs(ref);


  const docs =
    snapshot.docs
      .sort(
        (a,b) =>
          (b.data().updatedAt || 0) -
          (a.data().updatedAt || 0)
      );


  for (
    const chatDoc of docs
  ) {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "chatItem";


    const title =
      document.createElement(
        "span"
      );

    title.textContent =
      chatDoc.data().title ||
      "Новый чат";


    const del =
      document.createElement(
        "button"
      );

    del.className =
      "deleteChat";

    del.textContent =
      "✕";


    del.onclick =
      async event => {

        event.stopPropagation();

        await deleteDoc(
          doc(
            db,
            "users",
            currentUser.uid,
            "chats",
            chatDoc.id
          )
        );

        if (
          currentChatId ===
          chatDoc.id
        ) {

          newChat();

        }

        await loadChats();

      };


    item.append(
      title,
      del
    );


    item.onclick =
      () =>
        openChat(
          chatDoc.id
        );


    chatList.appendChild(
      item
    );

  }
}


async function openChat(
  chatId
) {

  if (!currentUser) return;


  const snapshot =
    await getDoc(
      doc(
        db,
        "users",
        currentUser.uid,
        "chats",
        chatId
      )
    );


  if (!snapshot.exists())
    return;


  const data =
    snapshot.data();


  currentChatId =
    chatId;


  history = [];


  messages.innerHTML =
    "";

  welcome.style.display =
    "none";


  for (
    const message
    of (data.messages || [])
  ) {

    history.push({
      role:
        message.role,

      content:
        message.content
    });


    addMessage(
      message.role,
      message.content
    );

  }

}


window.newChat =
  function () {

    currentChatId =
      null;

    history = [];

    messages.innerHTML =
      "";

    welcome.style.display =
      "block";

    input.value =
      "";

    selectedImage =
      null;

    photoInput.value =
      "";

    input.placeholder =
      "Напиши сообщение Locer...";

    input.focus();

  };


input.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      send();

    }

  }
);


input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        130
      ) + "px";

  }
);

</script>

</body>
</html>
