<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locer AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1117;
    color: #fff;
    height: 100vh;
    overflow: hidden;
}

.app {
    display: flex;
    height: 100vh;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    background: #171a22;
    border-right: 1px solid #292d38;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 18px;
}

.new-chat {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: #2b6cff;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.new-chat:hover {
    background: #1e5ce0;
}

.login {
    margin-top: 10px;
    width: 100%;
    padding: 11px;
    border: 1px solid #363b48;
    border-radius: 10px;
    background: #20242e;
    color: white;
    cursor: pointer;
}

.login:hover {
    background: #292e3a;
}

.saved-title {
    margin-top: 25px;
    color: #8d94a5;
    font-size: 13px;
}

.chats {
    margin-top: 8px;
    overflow-y: auto;
    flex: 1;
}

.chat-item {
    padding: 10px;
    margin-bottom: 5px;
    border-radius: 8px;
    cursor: pointer;
    color: #dfe3ec;
    font-size: 14px;
}

.chat-item:hover {
    background: #242934;
}

/* MAIN */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 60px;
    border-bottom: 1px solid #292d38;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 18px;
    font-weight: bold;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
}

.message {
    max-width: 850px;
    margin: 0 auto 18px auto;
    padding: 15px 17px;
    border-radius: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.ai {
    background: #1b1f29;
    border: 1px solid #292e3a;
    margin-right: auto;
}

/* THINKING */

.thinking {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #aeb6c8;
    font-size: 15px;
}

.thinking-icon {
    font-size: 19px;
}

.dots span {
    animation: blink 1.4s infinite;
    opacity: 0.2;
}

.dots span:nth-child(2) {
    animation-delay: 0.2s;
}

.dots span:nth-child(3) {
    animation-delay: 0.4s;
}

@keyframes blink {
    0%, 80%, 100% {
        opacity: 0.2;
    }

    40% {
        opacity: 1;
    }
}

/* INPUT */

.input-area {
    border-top: 1px solid #292d38;
    padding: 15px;
}

.input-box {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

textarea {
    flex: 1;
    resize: none;
    min-height: 48px;
    max-height: 160px;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #343a47;
    background: #191d26;
    color: white;
    outline: none;
    font-size: 15px;
    font-family: Arial, sans-serif;
}

textarea:focus {
    border-color: #3b82f6;
}

.send {
    width: 50px;
    height: 48px;
    border: 0;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.send:hover {
    background: #1d4ed8;
}

.send:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.status {
    max-width: 900px;
    margin: 7px auto 0;
    font-size: 12px;
    color: #777f91;
}

/* MOBILE */

@media (max-width: 700px) {
    .sidebar {
        display: none;
    }

    .messages {
        padding: 15px;
    }

    .message {
        max-width: 95%;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">🤖 Locer</div>

        <button class="new-chat" onclick="newChat()">
            ＋ Новый чат
        </button>

        <button class="login" onclick="loginGoogle()">
            Войти через Google
        </button>

        <div class="saved-title">
            Сохранённые чаты
        </div>

        <div class="chats" id="chats"></div>

    </aside>

    <main class="main">

        <div class="header">
            Locer AI
        </div>

        <div class="messages" id="messages">

            <div class="message ai">
                Привет! 👋 Я Locer — твой дружелюбный AI-помощник.
                Чем я могу помочь тебе сегодня? 😊
            </div>

        </div>

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    placeholder="Напиши сообщение..."
                    rows="1"
                ></textarea>

                <button
                    class="send"
                    id="sendBtn"
                    onclick="send()"
                >
                    ➤
                </button>

            </div>

            <div class="status" id="status">
                Google Gemini AI
            </div>

        </div>

    </main>

</div>

<script type="module">

/* =========================
   НАСТРОЙКИ
========================= */

const WORKER_URL =
    "https://locer-ai.ivan-ostanin1914.workers.dev";

const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const messages = document.getElementById("messages");
const status = document.getElementById("status");

let currentChatId = null;
let chatHistory = [];


/* =========================
   FIREBASE
========================= */

let firebaseReady = false;
let auth = null;
let db = null;
let currentUser = null;

const firebaseConfig = {
    apiKey: "AIzaSyCRlSjT9cwWyFD_rx_vqiGahEuZkeMHsRI",
    authDomain: "locer-5b749.firebaseapp.com",
    projectId: "locer-5b749",
    storageBucket: "locer-5b749.firebasestorage.app",
    messagingSenderId: "81394379218",
    appId: "1:81394379218:web:545d4e8390f630a5ee400b",
    measurementId: "G-6GZ1HZPR65"
};

try {

    const {
        initializeApp
    } = await import(
        "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js"
    );

    const {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged
    } = await import(
        "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js"
    );

    const {
        getFirestore,
        collection,
        doc,
        addDoc,
        setDoc,
        getDocs,
        getDoc,
        deleteDoc,
        query,
        orderBy,
        serverTimestamp
    } = await import(
        "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js"
    );

    const app = initializeApp(firebaseConfig);

    auth = getAuth(app);
    db = getFirestore(app);

    window.firebaseFunctions = {
        GoogleAuthProvider,
        signInWithPopup,
        onAuthStateChanged,
        collection,
        doc,
        addDoc,
        setDoc,
        getDocs,
        getDoc,
        deleteDoc,
        query,
        orderBy,
        serverTimestamp
    };

    firebaseReady = true;

    onAuthStateChanged(auth, async user => {

        currentUser = user;

        if (user) {

            document.querySelector(".login").textContent =
                "👤 " + (user.displayName || "Google");

            await loadChats();

        } else {

            document.querySelector(".login").textContent =
                "Войти через Google";

            document.getElementById("chats").innerHTML = "";

        }

    });

} catch (error) {

    console.error("Firebase:", error);

}


/* =========================
   GOOGLE LOGIN
========================= */

window.loginGoogle = async function() {

    if (!firebaseReady) {
        alert("Firebase ещё загружается. Попробуй ещё раз.");
        return;
    }

    try {

        const provider =
            new window.firebaseFunctions.GoogleAuthProvider();

        await window.firebaseFunctions.signInWithPopup(
            auth,
            provider
        );

    } catch (error) {

        console.error(error);

        alert(
            "Ошибка входа: " +
            (error.message || "неизвестная ошибка")
        );

    }

};


/* =========================
   НОВЫЙ ЧАТ
========================= */

window.newChat = function() {

    currentChatId = null;
    chatHistory = [];

    messages.innerHTML = `
        <div class="message ai">
            Привет! 👋 Я Locer — твой дружелюбный AI-помощник.
            Чем я могу помочь тебе сегодня? 😊
        </div>
    `;

    input.value = "";
    input.style.height = "auto";

    status.textContent = "Google Gemini AI";

};


/* =========================
   INPUT
========================= */

input.addEventListener("input", () => {

    input.style.height = "auto";
    input.style.height =
        Math.min(input.scrollHeight, 160) + "px";

});


input.addEventListener("keydown", event => {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();
        send();

    }

});


/* =========================
   ОЧИСТКА INPUT
========================= */

function clearInput() {

    input.value = "";
    input.style.height = "auto";

}


/* =========================
   ПОКАЗАТЬ THINKING
========================= */

function showThinking() {

    removeThinking();

    const div = document.createElement("div");

    div.className = "message ai";
    div.id = "thinkingMessage";

    div.innerHTML = `
        <div class="thinking">
            <span class="thinking-icon">🤔</span>
            <span>Locer думает</span>
            <span class="dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </span>
        </div>
    `;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;

}


/* =========================
   УБРАТЬ THINKING
========================= */

function removeThinking() {

    const old =
        document.getElementById("thinkingMessage");

    if (old) {
        old.remove();
    }

}


/* =========================
   ДОБАВИТЬ СООБЩЕНИЕ
========================= */

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className =
        "message " + type;

    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop =
        messages.scrollHeight;

    return div;

}


/* =========================
   ОТПРАВКА
========================= */

window.send = async function() {

    const text = input.value.trim();

    if (!text) return;

    if (sendBtn.disabled) return;

    addMessage(text, "user");

    chatHistory.push({
        role: "user",
        content: text
    });

    sendBtn.disabled = true;

    /*
       Очищаем поле сразу после отправки
    */
    clearInput();

    /*
       Показываем "Locer думает..."
    */
    showThinking();

    status.textContent =
        "🤔 Locer думает...";

    try {

        const response = await fetch(
            WORKER_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: text
                })
            }
        );

        let data = {};

        try {
            data = await response.json();
        } catch {
            data = {};
        }

        removeThinking();

        if (!response.ok) {

            console.error(
                "Gemini error:",
                data
            );

            /*
               503 превращаем в нормальное
               сообщение для пользователя
            */

            if (
                response.status === 503 ||
                data.gemini_status === 503
            ) {

                addMessage(
                    "😔 Gemini сейчас перегружен.\n\n" +
                    "Locer попробовал отправить запрос несколько раз, " +
                    "но Gemini временно не смог ответить.\n\n" +
                    "Попробуй отправить сообщение ещё раз через несколько секунд.",
                    "ai"
                );

                status.textContent =
                    "Gemini временно перегружен";

            } else {

                addMessage(
                    "❌ Не удалось получить ответ от Locer.\n\n" +
                    (
                        data.error ||
                        "Попробуй ещё раз."
                    ),
                    "ai"
                );

                status.textContent =
                    "Ошибка Gemini";

            }

            return;
        }

        if (!data.answer) {

            addMessage(
                "❌ Gemini не вернул текстовый ответ. Попробуй ещё раз.",
                "ai"
            );

            status.textContent =
                "Gemini не вернул ответ";

            return;
        }

        addMessage(
            data.answer,
            "ai"
        );

        chatHistory.push({
            role: "assistant",
            content: data.answer
        });

        status.textContent =
            "Google Gemini AI";

        await saveChat();

    } catch (error) {

        console.error(error);

        removeThinking();

        addMessage(
            "❌ Ошибка подключения к Locer.\n\n" +
            "Проверь интернет-соединение и попробуй ещё раз.",
            "ai"
        );

        status.textContent =
            "Ошибка подключения";

    } finally {

        sendBtn.disabled = false;

        input.focus();

    }

};


/* =========================
   FIRESTORE
========================= */

async function saveChat() {

    if (!firebaseReady || !currentUser) {
        return;
    }

    if (!chatHistory.length) {
        return;
    }

    try {

        const {
            collection,
            doc,
            addDoc,
            setDoc,
            serverTimestamp
        } = window.firebaseFunctions;

        const userChats = collection(
            db,
            "users",
            currentUser.uid,
            "chats"
        );

        const firstUserMessage =
            chatHistory.find(
                x => x.role === "user"
            );

        const title =
            firstUserMessage?.content
                ?.slice(0, 40) ||
            "Новый чат";

        if (!currentChatId) {

            const chatRef = await addDoc(
                userChats,
                {
                    title,
                    messages: chatHistory,
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp()
                }
            );

            currentChatId =
                chatRef.id;

        } else {

            await setDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    "chats",
                    currentChatId
                ),
                {
                    title,
                    messages: chatHistory,
                    updatedAt: serverTimestamp()
                },
                {
                    merge: true
                }
            );

        }

        await loadChats();

    } catch (error) {

        console.error(
            "Ошибка сохранения:",
            error
        );

    }

}


/* =========================
   ЗАГРУЗКА ЧАТОВ
========================= */

async function loadChats() {

    if (!firebaseReady || !currentUser) {
        return;
    }

    const chatsBox =
        document.getElementById("chats");

    try {

        const {
            collection,
            getDocs,
            query,
            orderBy
        } = window.firebaseFunctions;

        const ref =
            collection(
                db,
                "users",
                currentUser.uid,
                "chats"
            );

        let snapshot;

        try {

            snapshot = await getDocs(
                query(
                    ref,
                    orderBy(
                        "createdAt",
                        "desc"
                    )
                )
            );

        } catch {

            snapshot =
                await getDocs(ref);

        }

        chatsBox.innerHTML = "";

        snapshot.forEach(item => {

            const data = item.data();

            const div =
                document.createElement("div");

            div.className =
                "chat-item";

            div.textContent =
                "💬 " +
                (
                    data.title ||
                    "Новый чат"
                );

            div.onclick = () =>
                openChat(item.id);

            chatsBox.appendChild(div);

        });

    } catch (error) {

        console.error(
            "Ошибка загрузки чатов:",
            error
        );

    }

}


/* =========================
   ОТКРЫТЬ ЧАТ
========================= */

async function openChat(id) {

    if (!firebaseReady || !currentUser) {
        return;
    }

    try {

        const {
            doc,
            getDoc
        } = window.firebaseFunctions;

        const ref = doc(
            db,
            "users",
            currentUser.uid,
            "chats",
            id
        );

        const snapshot =
            await getDoc(ref);

        if (!snapshot.exists()) {
            return;
        }

        const data =
            snapshot.data();

        currentChatId = id;

        chatHistory =
            Array.isArray(data.messages)
                ? data.messages
                : [];

        messages.innerHTML = "";

        for (const message of chatHistory) {

            if (
                message.role === "user"
            ) {

                addMessage(
                    message.content,
                    "user"
                );

            } else if (
                message.role === "assistant"
            ) {

                addMessage(
                    message.content,
                    "ai"
                );

            }

        }

    } catch (error) {

        console.error(
            "Ошибка открытия чата:",
            error
        );

    }

}

</script>

</body>
</html>
