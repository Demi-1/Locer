<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Locer AI</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f7;
color:#222;
height:100vh;
overflow:hidden
}

.app{
display:flex;
height:100vh
}

.sidebar{
width:270px;
background:#fff;
border-right:1px solid #ddd;
display:flex;
flex-direction:column;
padding:15px
}

.logo{
font-size:26px;
font-weight:bold;
margin-bottom:15px
}

.new-chat{
border:0;
background:#222;
color:white;
border-radius:10px;
padding:12px;
font-size:15px;
cursor:pointer;
margin-bottom:15px
}

.new-chat:hover{
background:#333
}

.login-box{
border:1px solid #ddd;
border-radius:10px;
padding:10px;
margin-bottom:15px
}

.login-button{
width:100%;
border:1px solid #ccc;
background:white;
padding:10px;
border-radius:8px;
cursor:pointer;
font-size:14px
}

.login-button:hover{
background:#f5f5f5
}

.user-info{
font-size:13px;
word-break:break-word
}

.logout-button{
margin-top:8px;
width:100%;
border:0;
background:#eee;
padding:8px;
border-radius:8px;
cursor:pointer
}

.chats-title{
font-size:13px;
color:#777;
margin:5px 0 8px
}

.chats{
overflow-y:auto;
flex:1
}

.chat-item{
display:flex;
align-items:center;
gap:5px;
margin-bottom:5px
}

.chat-open{
flex:1;
border:0;
background:#f3f3f3;
padding:10px;
border-radius:8px;
cursor:pointer;
text-align:left;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis
}

.chat-open:hover{
background:#e8e8e8
}

.delete-chat{
border:0;
background:#ffe5e5;
color:#d00;
width:35px;
height:35px;
border-radius:8px;
cursor:pointer
}

.main{
flex:1;
display:flex;
flex-direction:column;
min-width:0
}

.topbar{
height:60px;
background:white;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
padding:0 20px;
font-weight:bold
}

.messages{
flex:1;
overflow-y:auto;
padding:25px
}

.welcome{
max-width:700px;
margin:80px auto;
text-align:center
}

.welcome h1{
font-size:38px;
margin-bottom:10px
}

.welcome p{
color:#777;
font-size:17px
}

.message{
max-width:850px;
margin:0 auto 18px;
display:flex
}

.message.user{
justify-content:flex-end
}

.message.ai{
justify-content:flex-start
}

.bubble{
max-width:80%;
padding:13px 16px;
border-radius:16px;
line-height:1.5;
overflow-wrap:anywhere
}

.user .bubble{
background:#222;
color:white;
border-bottom-right-radius:5px
}

.ai .bubble{
background:white;
border:1px solid #ddd;
border-bottom-left-radius:5px
}

.bubble img{
max-width:300px;
max-height:300px;
display:block;
border-radius:10px;
margin-top:8px
}

.photo-label{
color:#aaa;
font-size:12px;
margin-top:5px
}

.input-area{
background:white;
border-top:1px solid #ddd;
padding:12px
}

.image-preview{
max-width:850px;
margin:0 auto 8px;
display:none;
position:relative
}

.image-preview img{
max-width:120px;
max-height:120px;
border-radius:10px;
border:1px solid #ccc
}

.remove-image{
position:absolute;
top:-6px;
left:105px;
border:0;
background:#222;
color:white;
width:25px;
height:25px;
border-radius:50%;
cursor:pointer
}

.input-box{
max-width:850px;
margin:auto;
display:flex;
gap:8px;
align-items:flex-end
}

textarea{
flex:1;
resize:none;
min-height:48px;
max-height:150px;
border:1px solid #ccc;
border-radius:12px;
padding:13px;
font-family:Arial,sans-serif;
font-size:15px;
outline:0
}

textarea:focus{
border-color:#777
}

.photo-button,
.send-button{
height:48px;
min-width:48px;
border:0;
border-radius:12px;
cursor:pointer;
font-size:20px
}

.photo-button{
background:#eee
}

.send-button{
background:#222;
color:white
}

.photo-button:hover{
background:#ddd
}

.send-button:hover{
background:#333
}

.status{
max-width:850px;
margin:6px auto 0;
font-size:12px;
color:#888;
min-height:16px
}

.katex-display{
overflow-x:auto;
overflow-y:hidden;
padding:5px 0
}

@media(max-width:700px){

.sidebar{
width:210px
}

.messages{
padding:12px
}

.bubble{
max-width:90%
}

.welcome{
margin:50px auto
}

.welcome h1{
font-size:30px
}

}

@media(max-width:520px){

.sidebar{
display:none
}

.topbar{
padding:0 12px
}

.input-box{
gap:5px
}

.photo-button,
.send-button{
min-width:44px
}

}
</style>

</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
🤖 Locer
</div>

<button class="new-chat" id="newChatButton">
＋ Новый чат
</button>

<div class="login-box">

<div id="loginArea">

<button class="login-button" id="loginButton">
🔵 Войти через Google
</button>

</div>

<div id="userArea" style="display:none">

<div class="user-info" id="userInfo"></div>

<button class="logout-button" id="logoutButton">
Выйти
</button>

</div>

</div>

<div class="chats-title">
💬 Сохранённые чаты
</div>

<div class="chats" id="chats"></div>

</aside>

<main class="main">

<div class="topbar">
Locer AI 🤖
</div>

<div class="messages" id="messages">

<div class="welcome" id="welcome">

<h1>Привет! 👋</h1>

<p>
Я Locer — твой AI-помощник 🤖
</p>

<p>
Задай вопрос или отправь фотографию задания 📚📷
</p>

</div>

</div>

<div class="input-area">

<div class="image-preview" id="imagePreview">

<img id="previewImage">

<button class="remove-image" id="removeImage">
×
</button>

</div>

<div class="input-box">

<textarea
id="input"
rows="1"
placeholder="Напиши сообщение..."
></textarea>

<button
class="photo-button"
id="photoButton"
title="Отправить фото"

>

📷 </button>

<button
class="send-button"
id="sendButton"
title="Отправить"

>

➤ </button>

</div>

<input
id="photoInput"
type="file"
accept="image/*"
style="display:none"

>

<div class="status" id="status"></div>

</div>

</main>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
query,
orderBy,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyCRlSjT9cwWyFD_rx_vqiGahEuZkeMHsRI",

authDomain:"locer-5b749.firebaseapp.com",

projectId:"locer-5b749",

storageBucket:"locer-5b749.firebasestorage.app",

messagingSenderId:"81394379218",

appId:"1:81394379218:web:545d4e8390f630a5ee400b",

measurementId:"G-6GZ1HZPR65"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const provider=new GoogleAuthProvider();


/* VARIABLES */

let currentUser=null;
let currentChatId=null;

/*
Не называем это history,
потому что window.history уже существует.
*/
let chatHistory=[];

let selectedImage=null;


/* ELEMENTS */

const input=document.getElementById("input");
const messages=document.getElementById("messages");
const status=document.getElementById("status");


/* =========================
   ОТПРАВКА КНОПКОЙ
========================= */

document.getElementById("sendButton").onclick=function(){

send();

};


/* =========================
   ENTER
========================= */

input.onkeydown=function(event){

if(event.key==="Enter" && !event.shiftKey){

event.preventDefault();

send();

}

};


/* =========================
   АВТОРАЗМЕР TEXTAREA
========================= */

input.oninput=function(){

input.style.height="auto";

input.style.height=
Math.min(input.scrollHeight,150)+"px";

};


/* =========================
   ФОТО
========================= */

document.getElementById("photoButton").onclick=function(){

document.getElementById("photoInput").click();

};


document.getElementById("photoInput").onchange=function(event){

const file=event.target.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){

alert("Выбери изображение.");

return;

}

if(file.size>8*1024*1024){

alert("Фото должно быть меньше 8 МБ.");

event.target.value="";

return;

}

const reader=new FileReader();

reader.onload=function(e){

selectedImage=e.target.result;

document.getElementById("previewImage").src=
selectedImage;

document.getElementById("imagePreview").style.display=
"block";

};

reader.readAsDataURL(file);

};


/* =========================
   УДАЛИТЬ ФОТО
========================= */

document.getElementById("removeImage").onclick=function(){

removeImage();

};


function removeImage(){

selectedImage=null;

document.getElementById("imagePreview")
.style.display="none";

document.getElementById("photoInput").value="";

}


/* =========================
   GOOGLE
========================= */

document.getElementById("loginButton").onclick=
async function(){

try{

await signInWithPopup(
auth,
provider
);

}catch(error){

alert(
"Ошибка входа:\n\n"+
error.message
);

}

};


document.getElementById("logoutButton").onclick=
async function(){

await signOut(auth);

newChat();

};


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth,async user=>{

currentUser=user;

if(user){

document.getElementById("loginArea")
.style.display="none";

document.getElementById("userArea")
.style.display="block";

document.getElementById("userInfo")
.textContent=
"👤 "+
(user.displayName||"Пользователь")+
"\n"+
(user.email||"");

await loadChats();

}else{

document.getElementById("loginArea")
.style.display="block";

document.getElementById("userArea")
.style.display="none";

document.getElementById("chats")
.innerHTML="";

}

});


/* =========================
   ЗАГРУЗКА ЧАТОВ
========================= */

async function loadChats(){

if(!currentUser)return;

const chatsElement=
document.getElementById("chats");

chatsElement.innerHTML="Загрузка...";

try{

const chatsRef=
collection(
db,
"users",
currentUser.uid,
"chats"
);

const q=query(
chatsRef,
orderBy("createdAt","desc")
);

const snapshot=await getDocs(q);

chatsElement.innerHTML="";

snapshot.forEach(chatDoc=>{

const data=chatDoc.data();

const item=
document.createElement("div");

item.className="chat-item";


const openButton=
document.createElement("button");

openButton.className="chat-open";

openButton.textContent=
data.title||"Новый чат";

openButton.onclick=function(){

openChat(
chatDoc.id,
data.messages||[]
);

};


const deleteButton=
document.createElement("button");

deleteButton.className="delete-chat";

deleteButton.textContent="🗑️";

deleteButton.onclick=async function(event){

event.stopPropagation();

await deleteChat(chatDoc.id);

};


item.appendChild(openButton);

item.appendChild(deleteButton);

chatsElement.appendChild(item);

});

}catch(error){

console.error(error);

chatsElement.innerHTML=
"Не удалось загрузить чаты.";

}

}


/* =========================
   ОТКРЫТЬ ЧАТ
========================= */

function openChat(chatId,savedMessages){

currentChatId=chatId;

chatHistory=[];

clearMessages();

removeImage();


if(!Array.isArray(savedMessages)){

savedMessages=[];

}


savedMessages.forEach(message=>{

if(
!message||
typeof message.content!=="string"
){

return;

}

chatHistory.push({

role:message.role,

content:message.content

});

addMessage(
message.role==="assistant"
?"ai"
:"user",
message.content
);

});

}


/* =========================
   УДАЛИТЬ ЧАТ
========================= */

async function deleteChat(chatId){

if(!currentUser)return;

try{

await deleteDoc(
doc(
db,
"users",
currentUser.uid,
"chats",
chatId
)
);

if(currentChatId===chatId){

newChat();

}

await loadChats();

}catch(error){

alert(
"Не удалось удалить чат:\n"+
error.message
);

}

}


/* =========================
   СОХРАНИТЬ ЧАТ
========================= */

async function saveChat(){

if(!currentUser)return;

if(!chatHistory.length)return;


try{

const messagesToSave=
chatHistory.filter(message=>
message &&
typeof message.content==="string"
);


let title="Новый чат";

const firstUser=
messagesToSave.find(
message=>message.role==="user"
);

if(firstUser){

title=
firstUser.content
.replace(/\s+/g," ")
.trim()
.slice(0,4
