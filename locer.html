```html
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locer — AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: #fff;
      min-height: 100vh;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid #242936;
      background: #10131a;
      font-size: 22px;
      font-weight: bold;
    }

    .logo {
      color: #8b7cff;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .card {
      background: #121620;
      border: 1px solid #272d3a;
      border-radius: 18px;
      padding: 22px;
    }

    .card h2 {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      resize: vertical;
      border: 1px solid #303747;
      border-radius: 12px;
      background: #0b0e14;
      color: white;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #8b7cff;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: #0b0e14;
      color: #ddd;
      border: 1px solid #303747;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #7567ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #8a7dff;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 14px;
      color: #aeb5c3;
      min-height: 22px;
      font-size: 14px;
    }

    .preview,
    .result {
      margin-top: 18px;
      text-align: center;
    }

    .preview img,
    .result img {
      max-width: 100%;
      max-height: 500px;
      border-radius: 14px;
      border: 1px solid #303747;
      display: none;
    }

    .result a {
      display: none;
      margin-top: 12px;
      color: #a99fff;
      text-decoration: none;
    }

    .result a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      color: #6f7685;
      margin-top: 35px;
      font-size: 13px;
    }

    @media (max-width: 750px) {
      .grid {
        grid-template-columns: 1fr;
      }

      main {
        padding-top: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <span class="logo">Locer</span>&nbsp; — AI
</header>

<main>

  <h1>🖼️ Locer AI Images</h1>

  <div class="subtitle">
    Создавай изображения и редактируй свои картинки с помощью AI
  </div>

  <div class="grid">

    <!-- ГЕНЕРАЦИЯ -->

    <section class="card">

      <h2>🎨 Создать изображение</h2>

      <textarea
        id="generatePrompt"
        placeholder="Например: реалистичный оранжевый леопард в неоновом городе ночью, кинематографический свет"
      ></textarea>

      <button id="generateButton">
        ✨ Создать изображение
      </button>

      <div class="status" id="generateStatus"></div>

      <div class="result">
        <img id="generateResult" alt="Сгенерированное изображение">
        <br>
        <a id="generateOpen" target="_blank" rel="noopener">
          🔗 Открыть изображение
        </a>
      </div>

    </section>


    <!-- РЕДАКТИРОВАНИЕ -->

    <section class="card">

      <h2>✏️ Редактировать изображение</h2>

      <input
        type="file"
        id="editFile"
        accept="image/*"
      >

      <div class="preview">
        <img id="editPreview" alt="Предпросмотр">
      </div>

      <textarea
        id="editPrompt"
        placeholder="Например: добавь рядом со мной большого оранжевого леопарда"
      ></textarea>

      <button id="editButton">
        🪄 Редактировать изображение
      </button>

      <div class="status" id="editStatus"></div>

      <div class="result">
        <img id="editResult" alt="Отредактированное изображение">
        <br>
        <a id="editOpen" target="_blank" rel="noopener">
          🔗 Открыть изображение
        </a>
      </div>

    </section>

  </div>

  <div class="footer">
    Locer AI • генерация и редактирование изображений
  </div>

</main>

<script>

  const WORKER_URL =
    "https://locer-ai.ivan-ostanin1914.workers.dev";


  // ==========================================
  // ГЕНЕРАЦИЯ
  // ==========================================

  const generateButton =
    document.getElementById("generateButton");

  const generatePrompt =
    document.getElementById("generatePrompt");

  const generateStatus =
    document.getElementById("generateStatus");

  const generateResult =
    document.getElementById("generateResult");

  const generateOpen =
    document.getElementById("generateOpen");


  generateButton.addEventListener("click", async () => {

    const prompt = generatePrompt.value.trim();

    if (!prompt) {
      generateStatus.textContent =
        "⚠️ Напиши описание изображения.";
      return;
    }

    generateButton.disabled = true;

    generateStatus.textContent =
      "⏳ Создаю изображение...";

    generateResult.style.display = "none";
    generateOpen.style.display = "none";

    try {

      const response = await fetch(
        `${WORKER_URL}/generate`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            prompt: prompt,
            model: "flux",
            size: "1024x1024"
          })
        }
      );

      const data = await response.json();

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error ||
          "Не удалось создать изображение."
        );
      }

      generateResult.src = data.image;
      generateResult.style.display = "inline-block";

      generateOpen.href = data.image;
      generateOpen.style.display = "inline-block";

      generateStatus.textContent =
        "✅ Изображение готово!";

    } catch (error) {

      console.error(error);

      generateStatus.textContent =
        "❌ " + error.message;

    } finally {

      generateButton.disabled = false;

    }

  });


  // ==========================================
  // ПРЕДПРОСМОТР ЗАГРУЖЕННОЙ КАРТИНКИ
  // ==========================================

  const editFile =
    document.getElementById("editFile");

  const editPreview =
    document.getElementById("editPreview");


  editFile.addEventListener("change", () => {

    const file = editFile.files[0];

    if (!file) {
      editPreview.style.display = "none";
      return;
    }

    const url = URL.createObjectURL(file);

    editPreview.src = url;
    editPreview.style.display = "inline-block";

  });


  // ==========================================
  // РЕДАКТИРОВАНИЕ
  // ==========================================

  const editButton =
    document.getElementById("editButton");

  const editPrompt =
    document.getElementById("editPrompt");

  const editStatus =
    document.getElementById("editStatus");

  const editResult =
    document.getElementById("editResult");

  const editOpen =
    document.getElementById("editOpen");


  editButton.addEventListener("click", async () => {

    const file = editFile.files[0];
    const prompt = editPrompt.value.trim();

    if (!file) {
      editStatus.textContent =
        "⚠️ Сначала выбери изображение.";
      return;
    }

    if (!prompt) {
      editStatus.textContent =
        "⚠️ Напиши, что нужно изменить.";
      return;
    }

    editButton.disabled = true;

    editStatus.textContent =
      "⏳ Редактирую изображение...";

    editResult.style.display = "none";
    editOpen.style.display = "none";


    try {

      const formData = new FormData();

      formData.append(
        "image",
        file
      );

      formData.append(
        "prompt",
        prompt
      );

      formData.append(
        "model",
        "kontext"
      );

      formData.append(
        "size",
        "1024x1024"
      );


      const response = await fetch(
        `${WORKER_URL}/edit`,
        {
          method: "POST",
          body: formData
        }
      );


      const data = await response.json();


      if (!response.ok || !data.ok) {

        throw new Error(
          data.error ||
          "Не удалось отредактировать изображение."
        );

      }


      editResult.src = data.image;
      editResult.style.display = "inline-block";

      editOpen.href = data.image;
      editOpen.style.display = "inline-block";


      editStatus.textContent =
        "✅ Изображение отредактировано!";


    } catch (error) {

      console.error(error);

      editStatus.textContent =
        "❌ " + error.message;

    } finally {

      editButton.disabled = false;

    }

  });

</script>

</body>
</html>
