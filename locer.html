<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Locer AI</title>

  <!-- KaTeX для красивых математических формул -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #222;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      width: 270px;
      background: #ffffff;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .new-chat {
      border: none;
      background: #222;
      color: white;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 15px;
    }

    .new-chat:hover {
      background: #333;
    }

    .login-box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
    }

    .login-button {
      width: 100%;
      border: 1px solid #ccc;
      background: white;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .login-button:hover {
      background: #f5f5f5;
    }

    .user-info {
      font-size: 13px;
      word-break: break-word;
    }

    .logout-button {
      margin-top: 8px;
      width: 100%;
      border: none;
      background: #eee;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .chats-title {
      font-size: 13px;
      color: #777;
      margin: 5px 0 8px;
    }

    .chats {
      overflow-y: auto;
      flex: 1;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }

    .chat-open {
      flex: 1;
      border: none;
      background: #f3f3f3;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .chat-open:hover {
      background: #e8e8e8;
    }

    .delete-chat {
      border: none;
      background: #ffe5e5;
      color: #d00;
      width: 35px;
      height: 35px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ================= MAIN ================= */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 60px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-weight: bold;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px;
    }

    .welcome {
      max-width: 700px;
      margin: 80px auto;
      text-align: center;
    }

    .welcome h1 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #777;
      font-size: 17px;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: #222;
      color: white;
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: white;
      border: 1px solid #ddd;
      border-bottom-left-radius: 5px;
    }

    .bubble img {
      max-width: 300px;
      max-height: 300px;
      display: block;
      border-radius: 10px;
      margin-top: 8px;
    }

    .photo-label {
      color: #aaa;
      font-size: 12px;
      margin-top: 5px;
    }

    /* ================= INPUT ================= */

    .input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 12px;
    }

    .image-preview {
      max-width: 850px;
      margin: 0 auto 8px;
      display: none;
      position: relative;
    }

    .image-preview img {
      max-width: 120px;
      max-height: 120px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .remove-image {
      position: absolute;
      top: -6px;
      left: 105px;
      border: none;
      background: #222;
      color: white;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      cursor: pointer;
    }

    .input-box {
      max-width: 850px;
      margin: auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 150px;
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 13px;
      font-family: Arial, sans-serif;
      font-size: 15px;
      outline: none;
    }

    textarea:focus {
      border-color: #777;
    }

    .photo-button,
    .send-button {
      height: 48px;
      min-width: 48px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 20px;
    }

    .photo-button {
      background: #eee;
    }

    .send-button {
      background: #222;
      color: white;
    }

    .photo-button:hover {
      background: #ddd;
    }

    .send-button:hover {
      background: #333;
    }

    .status {
      max-width: 850px;
      margin: 6px auto 0;
      font-size: 12px;
      color: #888;
      min-height: 16px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {
      .sidebar {
        width: 210px;
      }

      .messages {
        padding: 12px;
      }

      .bubble {
        max-width: 90%;
      }

      .welcome {
        margin: 50px auto;
      }

      .welcome h1 {
        font-size: 30px;
      }
    }

    @media (max-width: 520px) {
      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 12px;
      }

      .input-box {
        gap: 5px;
      }

      .photo-button,
      .send-button {
        min-width: 44px;
      }
    }

    /* KaTeX */
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 5px 0;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ================= SIDEBAR ================= -->

  <aside class="sidebar">

    <div class="logo">
      🤖 Locer
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ Новый чат
    </button>

    <div class="login-box">

      <div id="loginArea">
        <button class="login-button" onclick="loginWithGoogle()">
          🔵 Войти через Google
        </button>
      </div>

      <div id="userArea" style="display:none;">
        <div class="user-info" id="userInfo"></div>

        <button class="logout-button" onclick="logout()">
          Выйти
        </button>
      </div>

    </div>

    <div class="chats-title">
      💬 Сохранённые чаты
    </div>

    <div class="chats" id="chats"></div>

  </aside>

  <!-- ================= MAIN ================= -->

  <main class="main">

    <div class="topbar">
      Locer AI 🤖
    </div>

    <div class="messages" id="messages">

      <div class="welcome" id="welcome">

        <h1>Привет! 👋</h1>

        <p>
          Я Locer — твой AI-помощник 🤖
        </p>

        <p>
          Можешь задать вопрос, решить пример
          или отправить фотографию задания 📚📷
        </p>

      </div>

    </div>

    <!-- ================= INPUT ================= -->

    <div class="input-area">

      <div class="image-preview" id="imagePreview">

        <img id="previewImage">

        <button
          class="remove-image"
          onclick="removeImage()"
        >
          ×
        </button>

      </div>

      <div class="input-box">

        <textarea
          id="input"
          placeholder="Напиши сообщение..."
          onkeydown="handleKey(event)"
        ></textarea>

        <button
          class="photo-button"
          onclick="document.getElementById('photoInput').click()"
          title="Отправить фото"
        >
          📷
        </button>

        <button
          class="send-button"
          onclick="send()"
          title="Отправить"
        >
          ➤
        </button>

      </div>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
        style="display:none"
        onchange="handlePhoto(event)"
      >

      <div class="status" id="status"></div>

    </div>

  </main>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  }
    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    query,
    orderBy,
    serverTimestamp
  }
    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";


  /* ================= FIREBASE CONFIG ================= */

  const firebaseConfig = {

    apiKey: "AIzaSyCRlSjT9cwWyFD_rx_vqiGahEuZkeMHsRI",

    authDomain: "locer-5b749.firebaseapp.com",

    projectId: "locer-5b749",

    storageBucket: "locer-5b749.firebasestorage.app",

    messagingSenderId: "81394379218",

    appId: "1:81394379218:web:545d4e8390f630a5ee400b",

    measurementId: "G-6GZ1HZPR65"

  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);

  const provider = new GoogleAuthProvider();


  /* ================= GLOBALS ================= */

  window.currentUser = null;

  window.currentChatId = null;

  window.history = [];

  window.selectedImage = null;


  /* ================= GOOGLE LOGIN ================= */

  window.loginWithGoogle = async function() {

    try {

      await signInWithPopup(auth, provider);

    } catch (error) {

      console.error(error);

      alert(
        "Не удалось войти через Google.\n\n" +
        error.message
      );

    }

  };


  /* ================= LOGOUT ================= */

  window.logout = async function() {

    try {

      await signOut(auth);

      newChat();

    } catch (error) {

      console.error(error);

    }

  };


  /* ================= AUTH STATE ================= */

  onAuthStateChanged(auth, async (user) => {

    currentUser = user;

    const loginArea =
      document.getElementById("loginArea");

    const userArea =
      document.getElementById("userArea");

    const userInfo =
      document.getElementById("userInfo");


    if (user) {

      loginArea.style.display = "none";

      userArea.style.display = "block";

      userInfo.innerHTML =
        "👤 " +
        escapeHtml(user.displayName || "Пользователь") +
        "<br>" +
        escapeHtml(user.email || "");

      await loadChats();

    } else {

      loginArea.style.display = "block";

      userArea.style.display = "none";

      document.getElementById("chats").innerHTML = "";

    }

  });


  /* ================= LOAD CHATS ================= */

  window.loadChats = async function() {

    if (!currentUser) return;

    const chatsElement =
      document.getElementById("chats");

    chatsElement.innerHTML = "Загрузка...";


    try {

      const chatsRef = collection(
        db,
        "users",
        currentUser.uid,
        "chats"
      );

      const q = query(
        chatsRef,
        orderBy("createdAt", "desc")
      );

      const snapshot = await getDocs(q);

      chatsElement.innerHTML = "";


      snapshot.forEach((chatDoc) => {

        const data = chatDoc.data();

        const item =
          document.createElement("div");

        item.className = "chat-item";


        const openButton =
          document.createElement("button");

        openButton.className = "chat-open";

        openButton.textContent =
          data.title || "Новый чат";


        openButton.onclick = () => {

          openChat(
            chatDoc.id,
            data.messages || []
          );

        };


        const deleteButton =
          document.createElement("button");

        deleteButton.className = "delete-chat";

        deleteButton.textContent = "🗑️";

        deleteButton.title = "Удалить чат";


        deleteButton.onclick = async (event) => {

          event.stopPropagation();

          await deleteChat(chatDoc.id);

        };


        item.appendChild(openButton);

        item.appendChild(deleteButton);

        chatsElement.appendChild(item);

      });


    } catch (error) {

      console.error(error);

      chatsElement.innerHTML =
        "Не удалось загрузить чаты";

    }

  };


  /* ================= OPEN CHAT ================= */

  window.openChat = function(chatId, savedMessages) {

    currentChatId = chatId;

    history = [];

    selectedImage = null;

    removeImage();

    clearMessages();


    if (!Array.isArray(savedMessages)) {
      savedMessages = [];
    }


    savedMessages.forEach(message => {

      if (
        !message ||
        !message.role ||
        typeof message.content !== "string"
      ) {
        return;
      }


      history.push({

        role: message.role,

        content: message.content

      });


      addMessage(
        message.role === "assistant"
          ? "ai"
          : "user",

        message.content

      );

    });


    scrollToBottom();

  };


  /* ================= DELETE CHAT ================= */

  window.deleteChat = async function(chatId) {

    if (!currentUser) {

      alert("Сначала войди через Google.");

      return;

    }


    try {

      await deleteDoc(
        doc(
          db,
          "users",
          currentUser.uid,
          "chats",
          chatId
        )
      );


      if (currentChatId === chatId) {

        newChat();

      }


      await loadChats();


    } catch (error) {

      console.error(error);

      alert(
        "Не удалось удалить чат:\n" +
        error.message
      );

    }

  };


  /* ================= SAVE CHAT ================= */

  window.saveChat = async function() {

    if (!currentUser) return;

    if (!history.length) return;


    try {

      /*
        ВАЖНО:

        history теперь содержит ТОЛЬКО строки.

        Фото туда НЕ попадает.

        Благодаря этому ошибка
        messages[1].content must be a string
        больше не возникает.
      */

      const messagesToSave =
        history
          .filter(message =>
            message &&
            typeof message.content === "string"
          )
          .map(message => ({

            role: message.role,

            content: message.content

          }));


      if (!messagesToSave.length) return;


      let title = "Новый чат";


      const firstUserMessage =
        messagesToSave.find(
          message => message.role === "user"
        );


      if (firstUserMessage) {

        title =
          firstUserMessage.content
            .replace(/\s+/g, " ")
            .trim()
            .slice(0, 40);

        if (!title) {
          title = "Фото задания 📷";
        }

      }


      const chatsRef = collection(
        db,
        "users",
        currentUser.uid,
        "chats"
      );


      if (currentChatId) {

        await deleteDoc(
          doc(
            db,
            "users",
            currentUser.uid,
            "chats",
            currentChatId
          )
        );

      }


      const newDoc =
        await addDoc(
          chatsRef,
          {

            title: title,

            messages: messagesToSave,

            createdAt: serverTimestamp()

          }
        );


      currentChatId = newDoc.id;

      await loadChats();


    } catch (error) {

      console.error(error);

      setStatus(
        "Чат не удалось сохранить: " +
        error.message
      );

    }

  };


  /* ================= NEW CHAT ================= */

  window.newChat = function() {

    currentChatId = null;

    history = [];

    selectedImage = null;

    removeImage();

    clearMessages();

    document.getElementById("welcome")
      .style.display = "block";

    setStatus("");

  };


  /* ================= CLEAR MESSAGES ================= */

  function clearMessages() {

    const messages =
      document.getElementById("messages");

    messages.innerHTML = `

      <div class="welcome" id="welcome">

        <h1>Привет! 👋</h1>

        <p>
          Я Locer — твой AI-помощник 🤖
        </p>

        <p>
          Можешь задать вопрос, решить пример
          или отправить фотографию задания 📚📷
        </p>

      </div>

    `;

  }


  /* ================= PHOTO ================= */

  window.handlePhoto = function(event) {

    const file =
      event.target.files[0];

    if (!file) return;


    if (!file.type.startsWith("image/")) {

      alert("Можно выбрать только изображение.");

      return;

    }


    /*
      Ограничиваем размер фотографии.
      Это помогает не отправлять огромные файлы.
    */

    if (file.size > 8 * 1024 * 1024) {

      alert(
        "Фото слишком большое.\n" +
        "Выбери изображение меньше 8 МБ."
      );

      event.target.value = "";

      return;

    }


    const reader =
      new FileReader();


    reader.onload = function(e) {

      selectedImage = e.target.result;


      document.getElementById("previewImage")
        .src = selectedImage;


      document.getElementById("imagePreview")
        .style.display = "block";

    };


    reader.readAsDataURL(file);

  };


  /* ================= REMOVE PHOTO ================= */

  window.removeImage = function() {

    selectedImage = null;


    const preview =
      document.getElementById("imagePreview");

    if (preview) {

      preview.style.display = "none";

    }


    const input =
      document.getElementById("photoInput");

    if (input) {

      input.value = "";

    }

  };


  /* ================= SEND ================= */

  window.send = async function() {

    const input =
      document.getElementById("input");

    const text =
      input.value.trim();


    if (!text && !selectedImage) {

      return;

    }


    /*
      Фото можно отправлять только после входа.
      Это соответствует твоему условию:
      при входе нужно войти через Google.
    */

    if (!currentUser) {

      alert(
        "Сначала войди через Google 🔵"
      );

      return;

    }


    document.getElementById("welcome")
      .style.display = "none";


    const imageForThisMessage =
      selectedImage;


    const textForThisMessage =
      text ||
      "Реши задание на фотографии. Объясни решение понятно и пошагово.";


    /*
      Показываем сообщение пользователя.
    */

    addMessage(
      "user",
      textForThisMessage,
      imageForThisMessage
    );


    /*
      ================================
      ГЛАВНОЕ ИСПРАВЛЕНИЕ
      ================================

      history содержит только:

      {
        role: "user",
        content: "обычный текст"
      }

      или

      {
        role: "assistant",
        content: "ответ AI"
      }

      Фото НЕ записываем в history.

      Но для текущего запроса отправляем
      фото в правильном multimodal формате.
    */


    const apiMessages =
      [...history];


    let currentMessage;


    if (imageForThisMessage) {

      currentMessage = {

        role: "user",

        content: [

          {

            type: "text",

            text: textForThisMessage

          },

          {

            type: "image_url",

            image_url: {

              url: imageForThisMessage

            }

          }

        ]

      };

    } else {

      currentMessage = {

        role: "user",

        content: textForThisMessage

      };

    }


    apiMessages.push(currentMessage);


    /*
      Теперь в history сохраняем
      ТОЛЬКО текст.

      Именно это исправляет ошибку:
      messages[1].content must be a string
    */

    history.push({

      role: "user",

      content: textForThisMessage

    });


    input.value = "";

    removeImage();


    setStatus("Locer думает... 🤔");


    /*
      Индикатор AI
    */

    const thinking =
      addMessage(
        "ai",
        "Думаю... 🤔"
      );


    try {

      const response =
        await fetch(
          "https://locer-ai.ivan-ostanin1914.workers.dev",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body: JSON.stringify({

              messages: apiMessages

            })

          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data?.error?.message ||
          "Ошибка сервера"
        );

      }


      const answer =
        data?.choices?.[0]?.message?.content;


      if (
        !answer ||
        typeof answer !== "string"
      ) {

        throw new Error(
          "AI не вернул текстовый ответ."
        );

      }


      /*
        Убираем "Думаю..."
      */

      thinking.remove();


      /*
        Показываем ответ.
      */

      addMessage(
        "ai",
        answer
      );


      /*
        Сохраняем ответ как обычную строку.
      */

      history.push({

        role: "assistant",

        content: answer

      });


      /*
        Сохраняем чат Firebase.
      */

      await saveChat();


      setStatus("");


    } catch (error) {

      console.error(error);


      thinking.remove();


      addMessage(
        "ai",
        "❌ Ошибка подключения: " +
        error.message
      );


      /*
        Убираем последнее сообщение пользователя
        из history, если запрос не удался.
      */

      if (
        history.length &&
        history[history.length - 1].role === "user"
      ) {

        history.pop();

      }


      setStatus("");

    }


    scrollToBottom();

  };


  /* ================= ADD MESSAGE ================= */

  window.addMessage = function(
    role,
    text,
    image = null
  ) {

    const messages =
      document.getElementById("messages");


    const wrapper =
      document.createElement("div");


    wrapper.className =
      "message " +
      (role === "user" ? "user" : "ai");


    const bubble =
      document.createElement("div");


    bubble.className = "bubble";


    /*
      textContent безопаснее,
      чем innerHTML.

      После добавления запускаем KaTeX.
    */

    if (text) {

      const textElement =
        document.createElement("div");

      textElement.textContent = text;

      bubble.appendChild(textElement);

    }


    if (image) {

      const imageElement =
        document.createElement("img");

      imageElement.src = image;

      imageElement.alt =
        "Фотография задания";

      bubble.appendChild(imageElement);


      const label =
        document.createElement("div");

      label.className = "photo-label";

      label.textContent =
        "📷 Фото задания";

      bubble.appendChild(label);

    }


    wrapper.appendChild(bubble);

    messages.appendChild(wrapper);


    /*
      Красивые дроби и формулы.
    */

    if (typeof renderMathInElement === "function") {

      renderMathInElement(bubble, {

        delimiters: [

          {
            left: "$$",
            right: "$$",
            display: true
          },

          {
            left: "\\[",
            right: "\\]",
            display: true
          },

          {
            left: "\\(",
            right: "\\)",
            display: false
          },

          {
            left: "$",
            right: "$",
            display: false
          }

        ],

        throwOnError: false

      });

    }


    scrollToBottom();


    return wrapper;

  };


  /* ================= KEYBOARD ================= */

  window.handleKey = function(event) {

    /*
      Enter отправляет сообщение.

      Shift + Enter делает новую строку.
    */

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      send();

    }

  };


  /* ================= STATUS ================= */

  function setStatus(text) {

    document.getElementById("status")
      .textContent = text;

  }


  /* ================= SCROLL ================= */

  function scrollToBottom() {

    const messages =
      document.getElementById("messages");

    setTimeout(() => {

      messages.scrollTop =
        messages.scrollHeight;

    }, 50);

  }


  /* ================= ESCAPE ================= */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

  }

</script>
