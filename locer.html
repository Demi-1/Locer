<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Locer — AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#08090d;color:#f5f5f7;height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
.sidebar{width:245px;background:#0d0f14;border-right:1px solid #20232c;padding:18px;display:flex;flex-direction:column}
.logo{font-size:27px;font-weight:800;margin-bottom:25px;letter-spacing:-1px}
.logo span{opacity:.45}
.new{width:100%;padding:12px;border:1px solid #303440;border-radius:10px;background:#171a22;color:white;cursor:pointer;font-size:15px}
.new:hover{background:#20242e}
.about{margin-top:auto;color:#777d8d;font-size:13px;line-height:1.5}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:64px;border-bottom:1px solid #20232c;display:flex;align-items:center;padding:0 24px;font-weight:700}
.chat{flex:1;overflow:auto;padding:35px 18px 140px}
.wrap{max-width:800px;margin:auto}
.welcome{text-align:center;margin-top:13vh}
.welcome h1{font-size:42px;margin:0 0 12px}
.welcome p{color:#8d93a3;font-size:17px}
.messages{display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;line-height:1.55}
.avatar{width:34px;height:34px;min-width:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;background:#262a35}
.user .avatar{background:#4f46e5}
.text{padding-top:4px;white-space:pre-wrap}
.composer{position:fixed;bottom:0;left:245px;right:0;padding:20px;background:linear-gradient(transparent,#08090d 25%)}
.box{max-width:800px;margin:auto;display:flex;gap:8px;background:#151821;border:1px solid #343846;border-radius:15px;padding:8px;box-shadow:0 8px 35px #0008}
textarea{flex:1;background:transparent;border:0;outline:0;color:white;resize:none;padding:10px;font:inherit;min-height:43px;max-height:130px}
.send{width:45px;border:0;border-radius:10px;background:#f1f1f3;color:#111;cursor:pointer;font-size:19px}
.send:hover{background:white}
.hint{text-align:center;color:#626878;font-size:11px;margin-top:8px}
@media(max-width:650px){
.sidebar{display:none}
.composer{left:0}
.top{padding:0 16px}
.welcome h1{font-size:34px}
.chat{padding-left:14px;padding-right:14px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">
  <div class="logo">Locer<span> AI</span></div>
  <button class="new" onclick="newChat()">＋ Новый чат</button>

  <div class="about">
    Locer — твой AI-помощник.
    <br><br>
    Powered by Groq.
  </div>
</aside>

<main class="main">

  <div class="top">Locer</div>

  <section class="chat" id="chat">
    <div class="wrap">

      <div class="welcome" id="welcome">
        <h1>Привет, я Locer 👋</h1>
        <p>Чем могу помочь?</p>
      </div>

      <div class="messages" id="messages"></div>

    </div>
  </section>

</main>
</div>

<div class="composer">

  <div class="box">

    <textarea
      id="input"
      rows="1"
      placeholder="Напиши сообщение Locer..."
      onkeydown="key(event)"
    ></textarea>

    <button class="send" onclick="send()">➤</button>

  </div>

  <div class="hint">
    Locer может ошибаться. Проверяй важную информацию.
  </div>

</div>

<script>

const WORKER_URL =
"https://locer-ai.ivan-ostanin1914.workers.dev";

const input = document.getElementById("input");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const chat = document.getElementById("chat");

let history = [];

function key(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height =
    Math.min(input.scrollHeight, 130) + "px";
});

function add(role, text) {

  const row = document.createElement("div");
  row.className = "msg " + role;

  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = role === "user" ? "Ты" : "L";

  const t = document.createElement("div");
  t.className = "text";
  t.textContent = text;

  row.append(av, t);
  messages.appendChild(row);

  chat.scrollTop = chat.scrollHeight;

  return t;
}

async function send() {

  const text = input.value.trim();

  if (!text) return;

  welcome.style.display = "none";

  add("user", text);

  input.value = "";
  input.style.height = "auto";

  history.push({
    role: "user",
    content: text
  });

  const bot = add("bot", "Думаю…");

  try {

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: [
          {
            role: "system",
            content:
              "Ты Locer — дружелюбный AI-помощник. Отвечай на русском языке, понятно и полезно."
          },
          ...history
        ]
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message ||
        "Ошибка сервера"
      );
    }

    const answer =
      data.choices?.[0]?.message?.content ||
      "Не удалось получить ответ.";

    bot.textContent = answer;

    history.push({
      role: "assistant",
      content: answer
    });

    chat.scrollTop = chat.scrollHeight;

  } catch (error) {

    bot.textContent =
      "Ошибка подключения к Locer AI:\n\n" +
      error.message;
  }
}

function newChat() {

  messages.innerHTML = "";
  history = [];

  welcome.style.display = "block";

  input.value = "";
  input.style.height = "auto";
  input.focus();
}

</script>

</body>
</html>
```
