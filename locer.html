<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Locer — AI</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:#0d0f12;
    color:#f1f3f5;
    overflow:hidden;
}

button,
textarea{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.app{
    display:flex;
    height:100vh;
    width:100%;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:245px;
    flex-shrink:0;
    background:#15181d;
    border-right:1px solid #292d34;
    display:flex;
    flex-direction:column;
    padding:15px;
}

.logo{
    font-size:23px;
    font-weight:bold;
    margin-bottom:18px;
}

.new-chat,
.login{
    width:100%;
    border:1px solid #343941;
    color:#fff;
    border-radius:12px;
    padding:11px;
    cursor:pointer;
    font-size:15px;
    margin-bottom:12px;
}

.new-chat{
    background:#20242b;
}

.login{
    background:#1b1f25;
}

.new-chat:hover,
.login:hover{
    background:#292e36;
}

.new-chat:active,
.login:active,
.settings-btn:active,
.photo-btn:active,
.send-btn:active{
    transform:scale(.98);
}

.user-info{
    font-size:12px;
    color:#9299a5;
    margin-bottom:10px;
    word-break:break-word;
}

.chat-list{
    flex:1;
    overflow-y:auto;
}

.chat-item{
    display:flex;
    align-items:center;
    gap:6px;
    padding:9px;
    border-radius:10px;
    margin-bottom:5px;
    cursor:pointer;
}

.chat-item:hover{
    background:#20242b;
}

.chat-title{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    color:#dfe3e8;
}

.delete-chat{
    border:0;
    background:transparent;
    color:#aab0b8;
    cursor:pointer;
    font-size:15px;
    padding:4px;
}

.delete-chat:hover{
    color:#fff;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    background:#0d0f12;
}

.header{
    height:60px;
    flex-shrink:0;
    border-bottom:1px solid #292d34;
    background:#111419;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    font-weight:bold;
}

.header-title{
    font-size:16px;
}

.settings-btn{
    border:1px solid #343941;
    background:#20242b;
    color:#fff;
    border-radius:10px;
    padding:8px 12px;
    cursor:pointer;
    font-size:15px;
}

.settings-btn:hover{
    background:#2b3038;
}

/* =========================
   MESSAGES
========================= */

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:25px;
}

.welcome{
    max-width:750px;
    margin:70px auto;
    text-align:center;
}

.welcome h1{
    font-size:36px;
    margin-bottom:10px;
}

.welcome p{
    color:#9299a5;
    line-height:1.6;
}

.message{
    max-width:900px;
    margin:0 auto 18px auto;
    display:flex;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:80%;
    padding:12px 16px;
    border-radius:16px;
    line-height:1.55;
    white-space:pre-wrap;
    word-wrap:break-word;
    overflow-wrap:anywhere;
}

.message.user .bubble{
    background:#303640;
    color:#fff;
    border-bottom-right-radius:5px;
}

.message.assistant .bubble{
    background:#181b20;
    border:1px solid #2b3038;
    color:#e8eaed;
    border-bottom-left-radius:5px;
}

/* =========================
   INPUT
========================= */

.input-area{
    flex-shrink:0;
    background:#0d0f12;
    border-top:1px solid #292d34;
    padding:14px;
}

.input-box{
    max-width:900px;
    margin:auto;
    border:1px solid #343941;
    border-radius:16px;
    background:#15181d;
    overflow:hidden;
}

textarea{
    display:block;
    width:100%;
    min-height:55px;
    max-height:180px;
    resize:none;
    border:0;
    outline:0;
    padding:15px;
    font-size:16px;
    background:#15181d;
    color:#fff;
}

textarea::placeholder{
    color:#777e89;
}

.controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px;
}

.left-controls{
    display:flex;
    align-items:center;
    gap:8px;
}

.photo-btn,
.send-btn{
    border:0;
    border-radius:10px;
    padding:9px 13px;
    cursor:pointer;
}

.photo-btn{
    background:#242931;
    color:#fff;
}

.photo-btn:hover{
    background:#2d333c;
}

.send-btn{
    background:#fff;
    color:#111;
    font-weight:bold;
}

.send-btn:hover{
    background:#e7e9ec;
}

.send-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.photo-preview{
    display:none;
    padding:8px 12px;
    border-top:1px solid #292d34;
    position:relative;
}

.photo-preview img{
    max-width:180px;
    max-height:120px;
    border-radius:10px;
    display:block;
}

.remove-photo{
    position:absolute;
    left:205px;
    top:8px;
    border:0;
    background:#292d34;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    padding:6px 9px;
}

/* =========================
   SETTINGS
========================= */

.settings-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:999;
    display:none;
}

.settings-overlay.open{
    display:block;
}

.settings-panel{
    position:fixed;
    top:0;
    right:0;
    width:390px;
    max-width:92vw;
    height:100vh;
    background:#15181d;
    border-left:1px solid #343941;
    z-index:1000;

    transform:translateX(100%);
    transition:transform .25s ease;

    display:flex;
    flex-direction:column;

    box-shadow:-10px 0 30px rgba(0,0,0,.35);
}

.settings-panel.open{
    transform:translateX(0);
}

.settings-header{
    height:60px;
    flex-shrink:0;
    padding:0 16px;
    border-bottom:1px solid #292d34;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.settings-header h2{
    margin:0;
    font-size:18px;
}

.close-settings{
    border:0;
    background:#242931;
    color:#fff;
    border-radius:9px;
    cursor:pointer;
    padding:8px 11px;
    font-size:16px;
}

.settings-content{
    padding:16px;
    overflow-y:auto;
}

.settings-section{
    margin-bottom:14px;
}

.settings-section > button{
    width:100%;
    text-align:left;
    border:1px solid #343941;
    background:#20242b;
    color:#fff;
    border-radius:11px;
    padding:12px;
    cursor:pointer;
    font-size:14px;
}

.settings-section > button:hover{
    background:#292e36;
}

.developer-panel{
    display:none;
    margin-top:12px;
}

.developer-panel.open{
    display:block;
}

.dev-status{
    padding:11px;
    border-radius:10px;
    background:#20242b;
    border:1px solid #343941;
    margin-bottom:10px;
    font-size:13px;
}

.dev-label{
    color:#9299a5;
    margin-bottom:5px;
    font-size:12px;
}

.dev-value{
    color:#fff;
    word-break:break-word;
}

.dev-box{
    background:#0d0f12;
    border:1px solid #343941;
    border-radius:10px;
    padding:10px;
    margin-bottom:10px;
}

.dev-box pre{
    margin:0;
    white-space:pre-wrap;
    word-break:break-word;
    color:#dfe3e8;
    font-size:11px;
    max-height:180px;
    overflow:auto;
}

.clear-logs{
    width:100%;
    border:1px solid #343941;
    background:#242931;
    color:#fff;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.clear-logs:hover{
    background:#2d333c;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .sidebar{
        width:190px;
        padding:10px;
    }

    .logo{
        font-size:20px;
    }

    .message{
        width:100%;
    }

    .bubble{
        max-width:90%;
    }

    .messages{
        padding:12px;
    }

    .welcome{
        margin-top:50px;
    }

    .welcome h1{
        font-size:30px;
    }

    .settings-panel{
        width:360px;
    }

}

@media(max-width:500px){

    .sidebar{
        width:170px;
    }

    .header{
        padding:0 10px;
    }

    .header-title{
        font-size:14px;
    }

    .settings-btn{
        font-size:13px;
        padding:7px 9px;
    }

    .input-area{
        padding:8px;
    }

    .photo-btn,
    .send-btn{
        padding:8px 10px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            🤖 Locer
        </div>

        <button
            type="button"
            class="new-chat"
            id="newChat">
            ＋ Новый чат
        </button>

        <button
            type="button"
            class="login"
            id="loginBtn">
            🔐 Войти через Google
        </button>

        <div
            class="user-info"
            id="userInfo">
        </div>

        <div
            class="chat-list"
            id="chatList">
        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <div class="header">

            <div class="header-title">
                Locer AI
            </div>

            <button
                type="button"
                class="settings-btn"
                id="settingsBtn">
                ⚙️ Настройки
            </button>

        </div>


        <div
            class="messages"
            id="messages">

            <div class="welcome">

                <h1>
                    Привет! 👋
                </h1>

                <p>
                    Я Locer — дружелюбный AI-помощник.
                    Задавай вопросы и присылай задания 📚
                </p>

            </div>

        </div>


        <!-- INPUT -->
        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Напиши сообщение..."
                    rows="1"></textarea>


                <div
                    class="photo-preview"
                    id="photoPreview">

                    <img
                        id="previewImage"
                        alt="Предпросмотр">

                    <button
                        type="button"
                        class="remove-photo"
                        id="removePhoto">
                        ✕
                    </button>

                </div>


                <div class="controls">

                    <div class="left-controls">

                        <button
                            type="button"
                            class="photo-btn"
                            id="photoBtn">
                            📷 Фото
                        </button>

                        <input
                            type="file"
                            id="photoInput"
                            accept="image/*"
                            hidden>

                    </div>


                    <button
                        type="button"
                        class="send-btn"
                        id="sendBtn">
                        Отправить ➤
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>


<!-- SETTINGS OVERLAY -->

<div
    class="settings-overlay"
    id="settingsOverlay">
</div>


<!-- SETTINGS PANEL -->

<aside
    class="settings-panel"
    id="settingsPanel">

    <div class="settings-header">

        <h2>
            ⚙️ Настройки
        </h2>

        <button
            type="button"
            class="close-settings"
            id="closeSettings">
            ✕
        </button>

    </div>


    <div class="settings-content">

        <div class="settings-section">

            <button
                type="button"
                id="developerBtn">
                🛠️ Для разработчиков
            </button>


            <div
                class="developer-panel"
                id="developerPanel">

                <div class="dev-status">

                    <div class="dev-label">
                        Состояние Worker
                    </div>

                    <div
                        class="dev-value"
                        id="devStatus">
                        Ожидание запроса
                    </div>

                </div>


                <div class="dev-status">

                    <div class="dev-label">
                        HTTP-код
                    </div>

                    <div
                        class="dev-value"
                        id="devHttp">
                        —
                    </div>

                </div>


                <div class="dev-status">

                    <div class="dev-label">
                        API
                    </div>

                    <div class="dev-value">
                        Yandex Responses API
                    </div>

                </div>


                <div class="dev-status">

                    <div class="dev-label">
                        Модель
                    </div>

                    <div class="dev-value">
                        YandexGPT 5 Lite
                    </div>

                </div>


                <div class="dev-box">

                    <div class="dev-label">
                        Последний запрос
                    </div>

                    <pre id="devRequest">—</pre>

                </div>


                <div class="dev-box">

                    <div class="dev-label">
                        Ответ Worker / Yandex
                    </div>

                    <pre id="devResponse">—</pre>

                </div>


                <div class="dev-box">

                    <div class="dev-label">
                        Последняя ошибка
                    </div>

                    <pre id="devError">—</pre>

                </div>


                <button
                    type="button"
                    class="clear-logs"
                    id="clearLogs">
                    🧹 Очистить данные
                </button>

            </div>

        </div>

    </div>

</aside>


<script>

/* =====================================================
   LOCER — ОСНОВНОЙ ИНТЕРФЕЙС
   Интерфейс НЕ зависит от Firebase.
===================================================== */


/* =========================
   WORKER
========================= */

const WORKER_URL =
    "https://locer-ai.ivan-ostanin1914.workers.dev";


/* =========================
   ELEMENTS
========================= */

const messagesEl =
    document.getElementById("messages");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const newChatBtn =
    document.getElementById("newChat");

const loginBtn =
    document.getElementById("loginBtn");

const userInfo =
    document.getElementById("userInfo");

const chatList =
    document.getElementById("chatList");

const photoBtn =
    document.getElementById("photoBtn");

const photoInput =
    document.getElementById("photoInput");

const photoPreview =
    document.getElementById("photoPreview");

const previewImage =
    document.getElementById("previewImage");

const removePhoto =
    document.getElementById("removePhoto");


/* SETTINGS */

const settingsBtn =
    document.getElementById("settingsBtn");

const settingsPanel =
    document.getElementById("settingsPanel");

const settingsOverlay =
    document.getElementById("settingsOverlay");

const closeSettings =
    document.getElementById("closeSettings");

const developerBtn =
    document.getElementById("developerBtn");

const developerPanel =
    document.getElementById("developerPanel");

const clearLogs =
    document.getElementById("clearLogs");

const devStatus =
    document.getElementById("devStatus");

const devHttp =
    document.getElementById("devHttp");

const devRequest =
    document.getElementById("devRequest");

const devResponse =
    document.getElementById("devResponse");

const devError =
    document.getElementById("devError");


/* =========================
   STATE
========================= */

let currentUser = null;
let currentChatId = null;
let chatHistory = [];
let selectedImage = null;

let firebaseReady = false;
let firebaseAuth = null;
let firebaseDb = null;
let firebaseProvider = null;


/* =========================
   SETTINGS
========================= */

function openSettings(){

    settingsPanel.classList.add("open");
    settingsOverlay.classList.add("open");

}

function closeSettingsPanel(){

    settingsPanel.classList.remove("open");
    settingsOverlay.classList.remove("open");

}

settingsBtn.addEventListener(
    "click",
    openSettings
);

closeSettings.addEventListener(
    "click",
    closeSettingsPanel
);

settingsOverlay.addEventListener(
    "click",
    closeSettingsPanel
);

developerBtn.addEventListener(
    "click",
    function(){

        developerPanel.classList.toggle("open");

    }
);


/* =========================
   DEVELOPER LOGS
========================= */

function setDevRequest(data){

    try{

        devRequest.textContent =
            JSON.stringify(
                data,
                null,
                2
            );

    }catch(error){

        devRequest.textContent =
            String(data);

    }

}


function setDevResponse(data){

    try{

        devResponse.textContent =
            JSON.stringify(
                data,
                null,
                2
            );

    }catch(error){

        devResponse.textContent =
            String(data);

    }

}


function setDevError(error){

    if(!error){

        devError.textContent = "—";
        return;

    }

    devError.textContent =
        error.message ||
        String(error);

}


clearLogs.addEventListener(
    "click",
    function(){

        devStatus.textContent =
            "Ожидание запроса";

        devHttp.textContent =
            "—";

        devRequest.textContent =
            "—";

        devResponse.textContent =
            "—";

        devError.textContent =
            "—";

    }
);


/* =========================
   WELCOME
========================= */

function showWelcome(){

    messagesEl.innerHTML = `

        <div class="welcome">

            <h1>
                Привет! 👋
            </h1>

            <p>
                Я Locer — дружелюбный AI-помощник.
                Задавай вопросы и присылай задания 📚
            </p>

        </div>

    `;

}


/* =========================
   NEW CHAT
========================= */

newChatBtn.addEventListener(
    "click",
    function(){

        currentChatId = null;
        chatHistory = [];

        showWelcome();

        input.focus();

    }
);


/* =========================
   PHOTO
========================= */

photoBtn.addEventListener(
    "click",
    function(){

        photoInput.click();

    }
);


photoInput.addEventListener(
    "change",
    function(){

        const file =
            photoInput.files &&
            photoInput.files[0];

        if(!file){
            return;
        }

        if(
            file.size >
            8 * 1024 * 1024
        ){

            alert(
                "Фото слишком большое. Максимум 8 МБ."
            );

            photoInput.value = "";
            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(){

                selectedImage =
                    reader.result;

                previewImage.src =
                    selectedImage;

                photoPreview.style.display =
                    "block";

            };


        reader.onerror =
            function(){

                alert(
                    "Не удалось открыть фотографию."
                );

            };


        reader.readAsDataURL(file);

    }
);


removePhoto.addEventListener(
    "click",
    function(){

        selectedImage = null;

        photoInput.value = "";

        previewImage.src = "";

        photoPreview.style.display =
            "none";

    }
);


/* =========================
   TEXTAREA
========================= */

input.addEventListener(
    "input",
    function(){

        input.style.height = "auto";

        input.style.height =
            Math.min(
                input.scrollHeight,
                180
            ) + "px";

    }
);


input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            send();

        }

    }
);


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    role,
    text
){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " + role;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.textContent =
        String(text ?? "");


    wrapper.appendChild(bubble);

    messagesEl.appendChild(wrapper);


    messagesEl.scrollTop =
        messagesEl.scrollHeight;

}


/* =========================
   SEND
========================= */

async function send(){

    const messageText =
        input.value.trim();


    if(!messageText){

        if(selectedImage){

            alert(
                "📷 Анализ фотографий пока не подключён.\nНапиши текстовое сообщение."
            );

        }

        return;

    }


    if(!currentUser){

        alert(
            "Сначала войди через Google 🔐"
        );

        return;

    }


    if(sendBtn.disabled){
        return;
    }


    sendBtn.disabled = true;

    devStatus.textContent =
        "🟡 Отправка запроса...";

    devHttp.textContent =
        "—";

    devError.textContent =
        "—";


    const requestBody = {

        message:
            messageText

    };


    setDevRequest(
        requestBody
    );


    try{

        addMessage(
            "user",
            messageText
        );


        chatHistory.push({

            role:
                "user",

            content:
                messageText

        });


        const response =
            await fetch(
                WORKER_URL,
                {

                    method:
                        "POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            requestBody
                        )

                }
            );


        devHttp.textContent =
            String(response.status);


        let data;


        try{

            data =
                await response.json();

        }catch(error){

            throw new Error(
                "Worker вернул неправильный JSON-ответ."
            );

        }


        setDevResponse(data);


        if(!response.ok){

            let errorText =
                "Ошибка сервера";


            if(
                typeof data?.error ===
                "string"
            ){

                errorText =
                    data.error;

            }


            if(data?.message){

                errorText +=
                    "\n" +
                    data.message;

            }


            if(data?.yandex_status){

                errorText +=
                    "\nКод Yandex: " +
                    data.yandex_status;

            }


            if(data?.yandex_response){

                errorText +=
                    "\nОтвет Yandex:\n" +
                    JSON.stringify(
                        data.yandex_response,
                        null,
                        2
                    );

            }


            throw new Error(
                errorText
            );

        }


        const answer =
            data?.answer;


        if(
            !answer ||
            typeof answer !== "string"
        ){

            throw new Error(
                "Yandex AI не вернул текстовый ответ."
            );

        }


        addMessage(
            "assistant",
            answer
        );


        chatHistory.push({

            role:
                "assistant",

            content:
                answer

        });


        await saveChat();


        input.value = "";

        input.style.height =
            "auto";


        selectedImage = null;

        photoInput.value = "";

        previewImage.src = "";

        photoPreview.style.display =

/* =========================
   SAVE CHAT
========================= */

async function saveChat(){

    if(!currentUser){
        return;
    }

    if(!firebaseReady){
        return;
    }

    if(!chatHistory.length){
        return;
    }


    try{

        const firestore =
            await import(
                "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js"
            );


        const chatsRef =
            firestore.collection(
                firebaseDb,
                "users",
                currentUser.uid,
                "chats"
            );


        const firstMessage =
            chatHistory.find(
                function(message){

                    return (
                        message.role ===
                        "user"
                    );

                }
            );


        const title =
            firstMessage?.content
                ?.slice(0,40)
            ||
            "Новый чат";


        /* Новый чат */

        if(!currentChatId){

            const chatRef =
                await firestore.addDoc(
                    chatsRef,
                    {

                        title:
                            title,

                        messages:
                            chatHistory,

                        createdAt:
                            firestore.serverTimestamp(),

                        updatedAt:
                            firestore.serverTimestamp()

                    }
                );


            currentChatId =
                chatRef.id;

        }else{

            /* Обновляем существующий */

            await firestore.updateDoc(
                firestore.doc(
                    firebaseDb,
                    "users",
                    currentUser.uid,
                    "chats",
                    currentChatId
                ),
                {

                    messages:
                        chatHistory,

                    title:
                        title,

                    updatedAt:
                        firestore.serverTimestamp()

                }
            );

        }


        await loadChats();


    }catch(error){

        console.error(
            "Ошибка сохранения:",
            error
        );

    }

}


/* =========================
   LOAD CHATS
========================= */

async function loadChats(){

    if(!currentUser){
        return;
    }

    if(!firebaseReady){
        return;
    }


    try{

        const firestore =
            await import(
                "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js"
            );


        chatList.innerHTML = "";


        const chatsRef =
            firestore.collection(
                firebaseDb,
                "users",
                currentUser.uid,
                "chats"
            );


        let snapshot;


        try{

            const q =
                firestore.query(
                    chatsRef,
                    firestore.orderBy(
                        "createdAt",
                        "desc"
                    )
                );

            snapshot =
                await firestore.getDocs(q);

        }catch(orderError){

            console.warn(
                "Сортировка чатов недоступна:",
                orderError
            );

            snapshot =
                await firestore.getDocs(
                    chatsRef
                );

        }


        snapshot.forEach(
            function(chatDoc){

                const data =
                    chatDoc.data();


                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "chat-item";


                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "chat-title";

                title.textContent =
                    data.title ||
                    "Новый чат";


                title.addEventListener(
                    "click",
                    function(){

                        openChat(
                            chatDoc.id,
                            data
                        );

                    }
                );


                const deleteBtn =
                    document.createElement(
                        "button"
                    );

                deleteBtn.type =
                    "button";

                deleteBtn.className =
                    "delete-chat";

                deleteBtn.textContent =
                    "🗑️";


                deleteBtn.addEventListener(
                    "click",
                    async function(event){

                        event.stopPropagation();

                        await deleteChat(
                            chatDoc.id
                        );

                    }
                );


                item.appendChild(title);

                item.appendChild(deleteBtn);

                chatList.appendChild(item);

            }
        );


    }catch(error){

        console.error(
            "Ошибка загрузки чатов:",
            error
        );

    }

}


/* =========================
   OPEN CHAT
========================= */

function openChat(
    id,
    data
){

    currentChatId =
        id;


    chatHistory =
        Array.isArray(data.messages)
        ? data.messages
        : [];


    messagesEl.innerHTML =
        "";


    if(!chatHistory.length){

        showWelcome();
        return;

    }


    chatHistory.forEach(
        function(message){

            addMessage(
                message.role,
                message.content
            );

        }
    );

}


/* =========================
   DELETE CHAT
========================= */

async function deleteChat(id){

    if(!currentUser){
        return;
    }

    if(!firebaseReady){
        return;
    }


    try{

        const firestore =
            await import(
                "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js"
            );


        await firestore.deleteDoc(
            firestore.doc(
                firebaseDb,
                "users",
                currentUser.uid,
                "chats",
                id
            )
        );


        if(currentChatId === id){

            currentChatId =
                null;

            chatHistory =
                [];

            showWelcome();

        }


        await loadChats();


    }catch(error){

        console.error(
            "Ошибка удаления:",
            error
        );


        alert(
            "Не удалось удалить чат.\n" +
            (
                error?.message ||
                ""
            )
        );

    }

}
