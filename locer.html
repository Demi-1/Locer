<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Locer — AI</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0d12;
  color: white;
}

header {
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  background: #10131a;
  border-bottom: 1px solid #272d3a;
  font-size: 22px;
  font-weight: bold;
}

.logo {
  color: #8b7cff;
}

main {
  max-width: 1050px;
  margin: auto;
  padding: 30px 18px 60px;
}

h1 {
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #9ca3af;
  margin-bottom: 30px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: #121620;
  border: 1px solid #292f3c;
  border-radius: 18px;
  padding: 22px;
}

textarea {
  width: 100%;
  min-height: 130px;
  padding: 14px;
  resize: vertical;
  background: #090c11;
  border: 1px solid #303747;
  border-radius: 12px;
  color: white;
  font-size: 16px;
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  background: #090c11;
  color: white;
  border: 1px solid #303747;
  border-radius: 10px;
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #7567ff;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #8b7cff;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

.status {
  margin-top: 14px;
  color: #b7bdca;
  min-height: 22px;
}

.image-box {
  margin-top: 18px;
  text-align: center;
}

.image-box img {
  display: none;
  max-width: 100%;
  max-height: 550px;
  border-radius: 14px;
  border: 1px solid #303747;
}

.open-link {
  display: none;
  margin-top: 12px;
  color: #aaa0ff;
  text-decoration: none;
}

.preview {
  margin-top: 15px;
  text-align: center;
}

.preview img {
  display: none;
  max-width: 100%;
  max-height: 350px;
  border-radius: 12px;
}

@media(max-width:750px) {

  .grid {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<header>
  <span class="logo">Locer</span>&nbsp; — AI
</header>

<main>

<h1>🖼️ Locer AI Images</h1>

<div class="subtitle">
  Генерация и редактирование изображений
</div>

<div class="grid">

<!-- ================= GENERATE ================= -->

<section class="card">

<h2>🎨 Создать изображение</h2>

<textarea
id="generatePrompt"
placeholder="Опиши изображение..."
></textarea>

<button id="generateButton">
✨ Создать изображение
</button>

<div
id="generateStatus"
class="status"
></div>

<div class="image-box">

<img
id="generateResult"
alt="Generated image"
>

<a
id="generateOpen"
class="open-link"
target="_blank"
>
🔗 Открыть изображение
</a>

</div>

</section>


<!-- ================= EDIT ================= -->

<section class="card">

<h2>✏️ Редактировать изображение</h2>

<input
id="editFile"
type="file"
accept="image/*"
>

<div class="preview">

<img
id="editPreview"
alt="Preview"
>

</div>

<textarea
id="editPrompt"
placeholder="Например: замени животное на большого реалистичного оранжевого леопарда, сохрани фон"
></textarea>

<button id="editButton">
🪄 Редактировать
</button>

<div
id="editStatus"
class="status"
></div>

<div class="image-box">

<img
id="editResult"
alt="Edited image"
>

<a
id="editOpen"
class="open-link"
target="_blank"
>
🔗 Открыть изображение
</a>

</div>

</section>

</div>

</main>


<script>

const WORKER =
"https://locer-ai.ivan-ostanin1914.workers.dev";


// ==========================================
// ГЕНЕРАЦИЯ
// ==========================================

const generateButton =
document.getElementById("generateButton");

const generatePrompt =
document.getElementById("generatePrompt");

const generateStatus =
document.getElementById("generateStatus");

const generateResult =
document.getElementById("generateResult");

const generateOpen =
document.getElementById("generateOpen");


generateButton.onclick = async () => {

  const prompt =
    generatePrompt.value.trim();

  if (!prompt) {
    generateStatus.textContent =
      "⚠️ Напиши описание изображения.";
    return;
  }

  generateButton.disabled = true;

  generateStatus.textContent =
    "⏳ Генерирую изображение...";

  generateResult.style.display = "none";
  generateOpen.style.display = "none";

  try {

    const res = await fetch(
      WORKER + "/generate",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          prompt,
          model: "flux",
          size: "1024x1024"
        })
      }
    );

    const data = await res.json();

    if (!res.ok || !data.ok) {
      throw new Error(
        data.error ||
        "Ошибка генерации"
      );
    }

    generateResult.src =
      data.image;

    generateResult.style.display =
      "inline-block";

    generateOpen.href =
      data.image;

    generateOpen.style.display =
      "inline-block";

    generateStatus.textContent =
      "✅ Изображение готово!";

  } catch (error) {

    console.error(error);

    generateStatus.textContent =
      "❌ " + error.message;

  } finally {

    generateButton.disabled = false;

  }

};


// ==========================================
// ПРЕДПРОСМОТР
// ==========================================

const editFile =
document.getElementById("editFile");

const editPreview =
document.getElementById("editPreview");


editFile.onchange = () => {

  const file =
    editFile.files[0];

  if (!file) {
    editPreview.style.display =
      "none";
    return;
  }

  editPreview.src =
    URL.createObjectURL(file);

  editPreview.style.display =
    "inline-block";
};


// ==========================================
// РЕДАКТИРОВАНИЕ
// ==========================================

const editButton =
document.getElementById("editButton");

const editPrompt =
document.getElementById("editPrompt");

const editStatus =
document.getElementById("editStatus");

const editResult =
document.getElementById("editResult");

const editOpen =
document.getElementById("editOpen");


editButton.onclick = async () => {

  const file =
    editFile.files[0];

  const prompt =
    editPrompt.value.trim();

  if (!file) {

    editStatus.textContent =
      "⚠️ Сначала выбери изображение.";

    return;
  }

  if (!prompt) {

    editStatus.textContent =
      "⚠️ Напиши, что изменить.";

    return;
  }

  editButton.disabled = true;

  editStatus.textContent =
    "⏳ Редактирую изображение...";

  editResult.style.display =
    "none";

  editOpen.style.display =
    "none";

  try {

    const form =
      new FormData();

    form.append(
      "image",
      file
    );

    form.append(
      "prompt",
      prompt
    );

    form.append(
      "model",
      "black-forest-labs/flux.1-kontext-pro"
    );

    form.append(
      "size",
      "1024x1024"
    );


    const res = await fetch(
      WORKER + "/edit",
      {
        method: "POST",
        body: form
      }
    );


    const data =
      await res.json();


    if (!res.ok || !data.ok) {

      throw new Error(
        data.error ||
        "Ошибка редактирования"
      );

    }


    editResult.src =
      data.image;

    editResult.style.display =
      "inline-block";

    editOpen.href =
      data.image;

    editOpen.style.display =
      "inline-block";

    editStatus.textContent =
      "✅ Готово!";

  } catch (error) {

    console.error(error);

    editStatus.textContent =
      "❌ " + error.message;

  } finally {

    editButton.disabled = false;

  }

};

</script>

</body>
</html>
